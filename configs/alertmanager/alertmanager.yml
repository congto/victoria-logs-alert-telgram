global:
  resolve_timeout: 1m

route:
  group_by: ['instance', 'severity']
  # wait to send notification
  group_wait: 1s
  group_interval: 2m
  # wait to resend notification
  repeat_interval: 5m
  routes:
  - match:
      # alert name defined in alerting_rules.yml
      alertname: rabbitmqDown
  receiver: 'ten-canh-bao'

receivers:
- name: 'ten-canh-bao'
  # Canh bao qua telegram
  telegram_configs:
  - chat_id: -252953753
    bot_token: '6383279569:AAEmkrHFwcrC3x4gxxxxxxxxxxxxxx'
    send_resolved: true

  # Canh bao toi slsack
  slack_configs:
  - api_url: "https://hooks.slack.com/services/T02QZ38QK/B0JL8KSJE/xxxxxxxxxxxx"
    channel: '#ctocanhbao'
    send_resolved: true
    title: "{{ .CommonLabels.alertname }} - {{ .Status }}"
    text: |
      {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *IP:* {{ .Labels.source_ip }}
        *Description:* {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
        *Source:* {{ .GeneratorURL }}
      {{ end }}