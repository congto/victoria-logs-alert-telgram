# /root/vmalert/configs/alertmanager/alertmanager.yml
global:
  resolve_timeout: 1m
route:
  receiver: 'telegram-notifications'
  group_wait: 1s
  group_interval: 1m
  repeat_interval: 5m

receivers:
- name: 'telegram-notifications'
  # Canh bao qua telegram
  telegram_configs:
  - chat_id: -252953753
    bot_token: '6383279569:AAEmkrHFwcrC3x4g8ndHyPmdddddđ'
    send_resolved: true

  # Canh bao toi slsack
  slack_configs:
  - api_url: "https://hooks.dddddd/services/T02QZ38QK/Bxxxxxxxxxxxxx"
    channel: '#ctocanhbao'
    send_resolved: true
    title: "{{ .CommonLabels.alertname }} - {{ .Status }}"
    text: |
      {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *IP:* {{ .Labels.source_ip }}
        *Description:* {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
        *Source:* {{ .GeneratorURL }}
      {{ end }}